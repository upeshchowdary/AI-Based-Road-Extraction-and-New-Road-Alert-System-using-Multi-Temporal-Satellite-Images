# City run (user, 2026-10-23): Bengaluru road extraction + road-change detection. Same code as statewide,
# different boundary. The frozen holdout rule (split.yaml, EPSG:7755 block hash) applies here too.
include: [lean.yaml, split.yaml, zones.yaml]
aoi:
  name: bangalore
  boundary: configs/boundaries/bangalore.geojson
  zones_extend_aoi: false   # AP zones lie far away; they are not part of this AOI
  grid:
    resolution_m: 10
    tile_size_px: 512
    crs: auto_utm
