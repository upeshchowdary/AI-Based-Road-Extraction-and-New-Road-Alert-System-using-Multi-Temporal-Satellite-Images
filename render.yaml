# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repo -> Apply.
# Guide: docs/guides/deploy_render.md
services:
  - type: web
    name: roadwatch-ap
    runtime: docker
    plan: free            # 512 MB RAM; sleeps after 15 min idle (first visit then takes ~1 min)
    region: singapore     # closest Render region to Andhra Pradesh
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true      # every push to main redeploys
    envVars:
      - key: ROADWATCH_OFFLINE
        value: "0"
      # public demo: the server refuses review writes (free disks are wiped on restart anyway);
      # each visitor's accept/reject decisions stay in their own browser
      - key: ROADWATCH_REVIEWS
        value: browser
