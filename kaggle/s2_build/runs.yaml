# Sentinel-2 composite builds on Kaggle CPU sessions (no GPU quota). Network-bound.
runs:
  zones:
    commit: HEAD            # resolved to the pushed git SHA at push time
    config: configs/pilot.yaml
    zones: [A, B, C]
    years: "2022-2026"
  pilot_latest:             # whole pilot AOI, newest seasons (match the 2026 OSM labels) -> S2 model training
    commit: HEAD
    config: configs/pilot.yaml
    zones_only: false
    shards: 6
    seasons_only: "2025_pre_monsoon,2025_post_monsoon,2026_pre_monsoon"
    years: "2025-2026"

  # --- all of Andhra Pradesh (configs/statewide.yaml, ~6,200 tiles per season; user 2026-10-18) ---
  # Pinned to the commit on GitHub (code unchanged since). Pre-monsoon seasons only after 2022:
  # post-monsoon is mostly cloud over coastal AP. 2022 pre+post = change-detection baseline.
  ap_2026_pre:              # newest season = matches the OSM snapshot -> also builds training labels
    commit: 5a49bf445217ba474091bef63c1792d1b66de59b
    config: configs/statewide.yaml
    zones_only: false
    shards: 8
    seasons_only: "2026_pre_monsoon"
    years: "2026-2026"
    labels: https://download.geofabrik.de/asia/india/southern-zone-latest.osm.pbf
  ap_2025_pre:
    commit: 5a49bf445217ba474091bef63c1792d1b66de59b
    config: configs/statewide.yaml
    zones_only: false
    shards: 8
    seasons_only: "2025_pre_monsoon"
    years: "2025-2025"
  ap_2024_pre:
    commit: 5a49bf445217ba474091bef63c1792d1b66de59b
    config: configs/statewide.yaml
    zones_only: false
    shards: 8
    seasons_only: "2024_pre_monsoon"
    years: "2024-2024"
  ap_2023_pre:
    commit: 5a49bf445217ba474091bef63c1792d1b66de59b
    config: configs/statewide.yaml
    zones_only: false
    shards: 8
    seasons_only: "2023_pre_monsoon"
    years: "2023-2023"
  ap_2022:
    commit: 5a49bf445217ba474091bef63c1792d1b66de59b
    config: configs/statewide.yaml
    zones_only: false
    shards: 8
    seasons_only: "2022_pre_monsoon,2022_post_monsoon"
    years: "2022-2022"

  ap_2022_r2:               # ap_2022 hit the Planetary Computer rate limit after 98 tiles (5 kernels x 8
    commit: 5a49bf445217ba474091bef63c1792d1b66de59b   # workers at once): resume it, fewer workers, retries
    config: configs/statewide.yaml
    zones_only: false
    shards: 4
    attempts: 8
    stagger_s: 30
    seasons_only: "2022_pre_monsoon,2022_post_monsoon"
    years: "2022-2022"
    kernel_sources: [upeshchowdary/roadwatch-s2-build-ap-2022]

kernel:
  title_prefix: roadwatch-s2-build
  code_file: run.py
  dataset_sources: []
  accelerator: ""
  enable_gpu: false
  is_private: true
  enable_internet: true
