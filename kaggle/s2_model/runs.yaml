# Tier-1 Sentinel-2 road model (10 m, B02 B03 B04 B08) on AP pilot tiles + OSM labels.
# Same trainer as Baseline A (data: s2_tiles). Splits come from the frozen registry:
# train/val fit; test = AP holdout blocks; zone_A/B/C = holdout zones, reported separately.
defaults:
  data: s2_tiles
  s2_seasons: [2025_pre_monsoon, 2025_post_monsoon, 2026_pre_monsoon]
  bands: [B02, B03, B04, B08]
  arch: Unet
  encoder: resnet34
  encoder_weights: imagenet
  crop: 256
  batch_size: 32
  crops_per_image: 4
  lr: 0.0005
  weight_decay: 0.0001
  subset_ratio: 1.0
  patience: 4
  val_every: 2
  num_workers: 4
  max_train_batches: 0
  eval_test: true
  export_onnx: true
  resume_dir: ""
  seed: 0
  max_hours: 1.5

runs:
  timing:
    epochs: 1
    timing_only: true
    eval_test: false
    export_onnx: false
  full_s0:          # timing: 80 s/epoch on T4x2 -> 25 epochs ~ 35 min (GPU-saving, user 2026-10-14)
    epochs: 25
    timing_only: false
    seed: 0
    max_hours: 0.75
  full_s1:          # 3 seeds for the final result (Section 7.5); same config as s0 (user, 2026-10-18)
    epochs: 25
    timing_only: false
    seed: 1
    max_hours: 0.75
  full_s2:
    epochs: 25
    timing_only: false
    seed: 2
    max_hours: 0.75
  v2_s0:            # statewide training (user, 2026-10-18): all AP train tiles, 2026 pre-monsoon (matches
    epochs: 15      # the OSM snapshot); same frozen holdout. ~6x v1's data -> ~8 min/epoch on T4x2.
    timing_only: false
    seed: 0
    max_hours: 2.0
    s2_seasons: [2026_pre_monsoon]
    kernel_sources: [upeshchowdary/roadwatch-s2-build-ap-2026-pre]

  v3_multiyear_s0:  # ADR-027: all AP, 2022 + 2026 pre-monsoon; 2022 imagery uses dated labels (roads OSM
    epochs: 15      # created after 2022-03 are ignored, not negatives). Same frozen holdout as v1/v2.
    timing_only: false
    seed: 0
    max_hours: 2.5
    s2_seasons: [2022_pre_monsoon, 2026_pre_monsoon]
    kernel_sources: [upeshchowdary/roadwatch-s2-build-ap-2026-pre, upeshchowdary/roadwatch-s2-build-ap-2022-r2,
                     upeshchowdary/roadwatch-labels-dated-ap-2022]

  cities_s0:        # Hyderabad + Bengaluru (user, 2026-10-23): city train/val tiles, 2025 + 2026 pre-monsoon
    epochs: 30      # (labels = current OSM). Tested on the cities' own holdout blocks; used for the city
    timing_only: false  # screening only if it beats the AP model (v1) there.
    seed: 0
    max_hours: 1.0
    s2_seasons: [2025_pre_monsoon, 2026_pre_monsoon]
    kernel_sources: [upeshchowdary/roadwatch-s2-build-hyd-build, upeshchowdary/roadwatch-s2-build-blr-build]

  # --- India south (ADR-025): training sample from kaggle/india sample_south_s0..s4 (~5,000 tiles, newest
  # clear pre-monsoon season per tile). A/B on the pretraining: same ResNet-50 U-Net, ImageNet vs
  # SSL4EO-S12 Sentinel-2 weights (TorchGeo). The map uses the better one on VALIDATION (not test).
  india_south_in:
    epochs: 20
    timing_only: false
    seed: 0
    encoder: resnet50
    encoder_weights: imagenet
    batch_size: 24
    max_hours: 2.5
    s2_seasons: [2026_pre_monsoon, 2025_pre_monsoon, 2024_pre_monsoon]
    kernel_sources: &south_sample [upeshchowdary/roadwatch-india-sample-south-s0, upeshchowdary/roadwatch-india-sample-south-s1,
                                   upeshchowdary/roadwatch-india-sample-south-s2, upeshchowdary/roadwatch-india-sample-south-s3,
                                   upeshchowdary/roadwatch-india-sample-south-s4]
  india_south_ssl:
    epochs: 20
    timing_only: false
    seed: 0
    encoder: resnet50
    encoder_weights: ssl4eo_s2_moco
    batch_size: 24
    max_hours: 2.5
    s2_seasons: [2026_pre_monsoon, 2025_pre_monsoon, 2024_pre_monsoon]
    kernel_sources: *south_sample

kernel:
  title_prefix: roadwatch-s2-model
  source: baseline_a/train.py
  code_file: train.py
  dataset_sources: [upeshchowdary/roadwatch-pilot-labels]
  kernel_sources: [upeshchowdary/roadwatch-s2-build-pilot-latest, upeshchowdary/roadwatch-s2-build-zones]
  accelerator: NvidiaTeslaT4
  is_private: true
  enable_internet: true
